

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: waap_ai_engine
    ports:
      - "8000:8000"
    networks:
      - waap-net
    restart: always

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waap_reverse_proxy
    ports:
      - "8080:8080"
    environment:
      - AI_SERVICE_ENDPOINT=http://ai-service:8000/score
      - WORDPRESS_BACKEND=http://host.docker.internal:80
    depends_on:
      - ai-service
    networks:
      - waap-net
    restart: always

networks:
  waap-net:
    driver: bridge